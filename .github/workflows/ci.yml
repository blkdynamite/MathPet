name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:verify
      # Offline generation eval: 200 deterministic specs must stay arithmetic-
      # consistent and template-safe. (The live pass needs ANTHROPIC_API_KEY
      # and is run manually; see evals/README.md.)
      - run: npm run eval:generate
      - run: npm run build
